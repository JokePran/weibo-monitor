name: 诊断抓取新鲜度

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-only
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行诊断
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          export TZ=Asia/Shanghai
          echo "北京时间: $(date '+%Y-%m-%d %H:%M:%S')"
          python3 diag.py
